<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="A dashboard showing spending bars and a forecast band">
  <defs>
    <linearGradient id="fpBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--fp-mint, #7FD4B8)" stop-opacity=".55"/>
      <stop offset="100%" stop-color="var(--fp-mint, #7FD4B8)" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <!-- back card -->
  <rect x="46" y="26" width="392" height="250" rx="20" fill="var(--fp-pine, #1C5A4E)" opacity=".12"/>
  <!-- main card -->
  <rect x="30" y="44" width="392" height="250" rx="20" fill="var(--fp-paper, #F7F5EF)" stroke="var(--fp-pine, #1C5A4E)" stroke-opacity=".18"/>

  <!-- header row -->
  <rect x="54" y="70" width="96" height="10" rx="5" fill="var(--fp-pine, #1C5A4E)" opacity=".85"/>
  <rect x="54" y="90" width="150" height="7" rx="3.5" fill="var(--fp-slate, #93A5A0)" opacity=".7"/>
  <rect x="336" y="68" width="62" height="24" rx="12" fill="var(--fp-gold, #E8A33D)" opacity=".9"/>

  <!-- bars -->
  <g fill="var(--fp-pine, #1C5A4E)" opacity=".8">
    <rect x="58"  y="192" width="22" height="46" rx="6"/>
    <rect x="94"  y="172" width="22" height="66" rx="6"/>
    <rect x="130" y="184" width="22" height="54" rx="6"/>
    <rect x="166" y="150" width="22" height="88" rx="6"/>
  </g>
  <rect x="202" y="132" width="22" height="106" rx="6" fill="var(--fp-gold, #E8A33D)"/>
  <line x1="54" y1="244" x2="230" y2="244" stroke="var(--fp-pine, #1C5A4E)" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>

  <!-- forecast band + line -->
  <path d="M258 214 L294 196 L330 200 L366 172 L398 152 L398 200 L366 208 L330 226 L294 220 L258 232 Z" fill="url(#fpBand)"/>
  <polyline points="258,224 294,208 330,212 366,190 398,176" fill="none"
            stroke="var(--fp-pine, #1C5A4E)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="398,176 398,176" fill="none" stroke="var(--fp-gold, #E8A33D)" stroke-width="8" stroke-linecap="round"/>

  <!-- small legend ticks -->
  <g fill="var(--fp-slate, #93A5A0)" opacity=".6">
    <rect x="258" y="252" width="34" height="6" rx="3"/>
    <rect x="300" y="252" width="34" height="6" rx="3"/>
    <rect x="342" y="252" width="34" height="6" rx="3"/>
  </g>

  <!-- floating rupee coin -->
  <g transform="translate(396 42)">
    <circle r="30" fill="var(--fp-gold, #E8A33D)"/>
    <circle r="30" fill="none" stroke="var(--fp-ink, #10302B)" stroke-opacity=".18" stroke-width="2"/>
    <g stroke="var(--fp-ink, #10302B)" stroke-width="3.2" stroke-linecap="round" fill="none">
      <line x1="-10" y1="-13" x2="10" y2="-13"/>
      <line x1="-10" y1="-5"  x2="10" y2="-5"/>
      <path d="M-10 3 h9 a8 8 0 0 0 0 -16"/>
      <line x1="-2" y1="3" x2="8" y2="15"/>
    </g>
  </g>
</svg>
