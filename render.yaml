# Render Blueprint — lets you deploy via "New > Blueprint" pointing at this repo
# instead of configuring the web service by hand. See README.md "Deploying" section.
services:
  - type: web
    name: finpilot-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: INR
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard — never committed
      - key: CORS_ORIGINS
        value: '["https://CHANGE-ME.netlify.app"]' # replace with your real Netlify URL after it's live
      - key: MAX_CSV_UPLOAD_MB
        value: "5"

databases:
  - name: finpilot-db
    plan: free
